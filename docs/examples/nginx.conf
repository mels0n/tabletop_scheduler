server {
    listen 80;
    server_name scheduler.yourdomain.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name scheduler.yourdomain.com;

    # SSL Certificates (Example paths - use Let's Encrypt/Certbot)
    ssl_certificate /etc/letsencrypt/live/scheduler.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scheduler.yourdomain.com/privkey.pem;

    # Security headers: the app already sends X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy and HSTS on every response. Do not add
    # conflicting copies here.

    location / {
        # Proxy to the Docker container
        proxy_pass http://localhost:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward the client address and scheme to the app
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram webhook (/api/telegram/webhook) needs no special handling: the location
    # above covers it. Keep the X-Telegram-Bot-Api-Secret-Token header intact.
    # Optional explicit block:
    # location /api/telegram/webhook {
    #     proxy_pass http://localhost:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
}
