version: 2
# Security updates only. open-pull-requests-limit: 0 turns off routine version
# updates; Dependabot security updates (enabled in the repository settings) still
# open a pull request for each advisory, on their own limit. Upgrades without an
# advisory are planned and done by hand.
#
# There are no ignore rules: they also apply to security updates, so ignoring a
# major (Prisma, Node) would hide the fix for an advisory that needs one. Such a
# pull request fails CI and is then done as a planned migration.
#
# There is no docker entry: Dependabot raises no security updates for base
# images, and the Dockerfile's node:22-alpine tag already tracks the latest 22.x.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # The Prisma CLI and client must stay on the same version.
      prisma:
        applies-to: security-updates
        patterns: ["prisma", "@prisma/client"]
      # @vitest/coverage-v8 pins vitest exactly.
      vitest:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*"]
      # next and eslint-config-next are pinned exact and released together.
      next:
        applies-to: security-updates
        patterns: ["next", "eslint-config-next"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
