# Guards the hosted (Vercel + Supabase) database against schema drift.
#
# Production deploys apply migrations themselves (scripts/vercel-build.sh), so the
# realistic failure left is authoring: someone edits prisma/hosted/schema.prisma
# and forgets to generate the matching migration. migrate deploy then applies
# nothing, the app ships expecting a column that does not exist, and it fails at
# runtime -- exactly how LoginToken.telegramUsername stayed missing for a month.
#
# The main check replays the migration history into a throwaway Postgres and
# compares the result against the schema, so it needs no production credentials.

name: DB drift check

on:
  push:
    branches: [ "main" ]
    paths:
      - 'prisma/**'
      - '.github/workflows/db-drift.yml'
  pull_request:
    paths:
      - 'prisma/**'
  schedule:
    # 12:00 UTC daily, so a hand-edit in the Supabase console gets caught even
    # with no pushes (optional prod-drift job below).
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  schema-parity:
    name: Both schema files declare the same models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/schema-parity.test.ts

  migrations-cover-schema:
    name: Migration history produces the hosted schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Replay prisma/hosted/migrations and diff against the schema
        run: |
          # --exit-code: 0 = the history fully produces the schema, 2 = something in
          # the schema has no migration behind it. The SQL printed on failure is
          # exactly the migration that is missing.
          npx prisma migrate diff \
            --from-migrations prisma/hosted/migrations \
            --to-schema-datamodel prisma/hosted/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/postgres" \
            --script \
            --exit-code

  prod-drift:
    name: Production matches the hosted schema (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Compare production against prisma/hosted/schema.prisma
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          # Only catches drift the deploy cannot: someone editing the live database
          # by hand. Skipped unless a DIRECT_URL secret is configured, so production
          # credentials in GitHub stay opt-in.
          if [ -z "$DIRECT_URL" ]; then
            echo "::notice::No DIRECT_URL secret set; skipping the live production comparison."
            exit 0
          fi
          npx prisma migrate diff \
            --from-url "$DIRECT_URL" \
            --to-schema-datamodel prisma/hosted/schema.prisma \
            --script \
            --exit-code
