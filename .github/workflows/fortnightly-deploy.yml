name: Fortnightly deploy

# Triggers a Vercel production rebuild of main every other Thursday through a
# deploy hook (secret VERCEL_DEPLOY_HOOK_URL). No commit is pushed: main is
# protected by a ruleset that requires CI, and the rebuild only needs Vercel
# to build the current main again.
#
# This is what publishes scheduled blog posts: scripts/generate-published-posts.mjs
# filters by `date` (and `draft`) at build time, so a post dated in the future
# never enters the built site (index, slug page, sitemap, schema) until a build
# runs on or after its date. The site reads posts only from the generated module.
#
# GitHub Actions cron has no native "every 2 weeks" schedule, so this runs
# every Thursday and skips itself on the off week by checking ISO week parity
# against a fixed reference date (2026-08-13, the first scheduled slot).

on:
  schedule:
    # 13:00 UTC every Thursday (8:00am CDT / 7:00am CST).
    - cron: "0 13 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortnightly-deploy
  cancel-in-progress: false

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check fortnightly cadence
        id: cadence
        run: |
          reference="2026-08-13"
          today=$(date -u +%F)
          days=$(( ( $(date -u -d "$today" +%s) - $(date -u -d "$reference" +%s) ) / 86400 ))
          weeks_since=$(( days / 7 ))
          if [ $((weeks_since % 2)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "on_cadence=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_cadence=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel rebuild of main
        if: steps.cadence.outputs.on_cadence == 'true'
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          # --fail turns a 4xx/5xx from Vercel into a red job instead of a silent no-op.
          curl --fail --silent --show-error -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Rebuild requested."
