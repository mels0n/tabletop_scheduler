name: Docker Build & Push

# Gating: the `ci` job calls ci.yml as a reusable workflow and `build` needs it,
# so `latest` and the sha/semver tags are only pushed from a commit that passed
# every ci.yml job: typecheck, lint, tests, build, the migration check and the
# self-host upgrade check (selfhost-upgrade). A workflow_run trigger
# would also work, but it runs from the default branch copy of the workflow and
# loses the tag ref that the semver tags depend on. PRs build and scan the
# image but never push, and skip the ci gate (ci.yml already runs on PRs).

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'content/**'
      - '.claude/**'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'content/**'
      - '.claude/**'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # Run when ci passed, or was skipped (pull_request); never when it failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Scan before anything is pushed. A multi-arch build cannot be loaded into
      # the local daemon, so scan the amd64 image; the layer cache lets the
      # final multi-arch build reuse it.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned by commit SHA (v0.36.0, resolved from the upstream release tag).
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: scan-target:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
